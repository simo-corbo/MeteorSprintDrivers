[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteor-sprint"
version = "0.1.0"
description = "Open-source macOS printing support for the Meteor Sprint thermal receipt printer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Simone Corbo" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = [
    "pyusb>=1.2.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# Needed to run/build the CUPS filter (cups/filters/rastertometeorsprint),
# not the core package -- see docs/architecture.md.
cups = [
    "pymupdf",
    "pyinstaller",
]

[tool.setuptools.packages.find]
where = ["src"]
